<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Radio LoRa</title>
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<style>
  :root{--bg:#0f1720;--card:#17212c;--line:#253241;--tx:#e8eef4;--mu:#8a9bab;--yo:#1e4a6e;--ok:#3fd17a;--bad:#ff5d5d;--lo:#ffb23b;--az:#3ba7ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
  h1{font-size:19px;margin:0}
  h1 small{display:block;font-size:12px;color:var(--mu);font-weight:400}
  .pill{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--line);color:var(--mu);white-space:nowrap}
  .pill.on{background:rgba(63,209,122,.15);color:var(--ok)}
  .pill.lo{background:rgba(255,178,59,.15);color:var(--lo)}
  .pill.off{background:rgba(255,93,93,.15);color:var(--bad)}
  main{max-width:900px;margin:0 auto;padding:16px;display:grid;gap:16px}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card h2{margin:0 0 10px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;display:flex;justify-content:space-between;align-items:center}
  .big{font-size:30px;font-weight:700;line-height:1.1}
  .big span{font-size:15px;color:var(--mu);font-weight:400}
  .sub{font-size:13px;color:var(--mu);margin-top:6px}
  #alerta{display:none;background:var(--bad);color:#fff;border-radius:14px;padding:14px 16px;font-weight:700;align-items:center;justify-content:space-between;animation:p 1s infinite}
  #alerta button{background:#fff;color:var(--bad);border:0;border-radius:8px;padding:6px 12px;font-weight:700}
  @keyframes p{50%{opacity:.75}}
  #log{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
  .m{max-width:80%;padding:8px 11px;border-radius:12px;background:var(--bg)}
  .m small{display:block;font-size:11px;color:var(--mu)}
  .m.web{align-self:flex-end;background:var(--yo)}
  .m.sos{background:#5c1a1a;border:1px solid var(--bad)}
  .vacio{color:var(--mu);margin:auto;font-size:14px}
  form{display:flex;gap:8px}
  input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit}
  button{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
  #env{background:var(--az);color:#04121f}
  #sos{background:var(--bad);color:#fff}
  details{font-size:13px;color:var(--mu)}
  details input{margin-top:6px;width:100%}
</style>
</head>
<body>
<header>
  <h1>📡 Radio LoRa<small>ESP32 · RYLR998 · ESP-NOW</small></h1>
  <span id="conn" class="pill">Conectando…</span>
</header>

<main>
  <div id="alerta"><span id="alertaTxt">🚨 SOS</span><button id="visto">Visto</button></div>

  <div class="grid">
    <section class="card">
      <h2>Estación base <span id="stBase" class="pill">—</span></h2>
      <div class="big" id="baseTxt">—</div>
      <div class="sub" id="baseSub">Esperando datos de la base…</div>
    </section>
    <section class="card">
      <h2>⚡ Enlace cercano <span id="stCerca" class="pill">—</span></h2>
      <div class="big" id="cercaRssi">—<span> dBm</span></div>
      <div class="sub">ESP-NOW: texto, fotos y notas de voz</div>
    </section>
    <section class="card">
      <h2>📡 Enlace LoRa <span id="stLora" class="pill">—</span></h2>
      <div class="big" id="loraRssi">—<span> dBm</span></div>
      <div class="sub" id="loraSnr">SNR —</div>
    </section>
  </div>

  <section class="card">
    <h2>Mensajes</h2>
    <div id="log"><div class="vacio" id="vacio">Sin mensajes todavía</div></div>
    <form id="f">
      <input id="txt" maxlength="150" placeholder="Escribe a las estaciones…" autocomplete="off">
      <button id="env">Enviar</button>
      <button type="button" id="sos">SOS</button>
    </form>
  </section>

  <details class="card">
    <summary>Configuración</summary>
    <label>Prefijo (igual al TOPIC_PREFIX del ESP32)<input id="prefix"></label>
  </details>
</main>

<script>
const BROKER = "wss://broker.hivemq.com:8884/mqtt";
const DEFAULT_PREFIX = "panarepara-radio-acbdcce2";
const DEMO = new URLSearchParams(location.search).has("demo");
const $ = id => document.getElementById(id);

// --- prefijo guardado en el navegador ---
let prefix = DEFAULT_PREFIX;
try { prefix = localStorage.getItem("prefix") || DEFAULT_PREFIX; } catch (e) {}
$("prefix").value = prefix;
$("prefix").addEventListener("change", () => {
  try { localStorage.setItem("prefix", $("prefix").value.trim()); } catch (e) {}
  location.reload();
});

// --- estado de los enlaces ---
let ultimoEstado = 0;
function pill(el, on, txtOn, txtOff, cls = "on") { el.textContent = on ? txtOn : txtOff; el.className = "pill " + (on ? cls : "off"); }
function mostrarEstado(e, vivo) {
  if (vivo) ultimoEstado = Date.now();
  if (!e.base) { pill($("stBase"), false, "", "Apagada"); $("baseTxt").textContent = "Apagada"; return; }
  $("baseTxt").textContent = "En línea";
  $("baseSub").textContent = "Conectada al WiFi de casa y a este servidor";
  pill($("stCerca"), e.cerca.on, "Cerca", "Fuera de alcance");
  $("cercaRssi").innerHTML = (e.cerca.on ? e.cerca.rssi : "—") + "<span> dBm</span>";
  pill($("stLora"), e.lora.on, "Activo", "Sin señal", "lo");
  $("loraRssi").innerHTML = (e.lora.on ? e.lora.rssi : "—") + "<span> dBm</span>";
  $("loraSnr").textContent = "SNR " + (e.lora.on ? e.lora.snr + " dB" : "—") + " · el mínimo útil en SF9 es -12 dB";
}
setInterval(() => {   // la base publica su estado cada 10 s
  const on = Date.now() - ultimoEstado < 30000;
  pill($("stBase"), on, "En línea", "Sin datos");
}, 1000);

// --- mensajes ---
function nombre(n) { return n == 0 ? "Web" : "Equipo " + n; }
function addMsg(m) {
  $("vacio").style.display = "none";
  const d = document.createElement("div");
  d.className = "m" + (m.de == 0 ? " web" : "") + (m.t == 1 ? " sos" : "");
  const s = document.createElement("small");
  const via = m.via == "E" ? " · ⚡ cerca" : m.via == "L" ? " · 📡 LoRa" : "";
  s.textContent = nombre(m.de) + " · " + new Date().toLocaleTimeString("es-PA", { hour: "2-digit", minute: "2-digit" }) + via;
  d.append(s, document.createTextNode((m.t == 1 ? "🚨 " : "") + m.x));
  $("log").append(d); $("log").scrollTop = $("log").scrollHeight;
  if (m.t == 1 && m.de != 0) {
    $("alertaTxt").textContent = "🚨 " + nombre(m.de) + ": " + m.x;
    $("alerta").style.display = "flex";
    if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
  }
}
$("visto").onclick = () => $("alerta").style.display = "none";

// --- conexión MQTT ---
let client = null;
if (!DEMO) {
  client = mqtt.connect(BROKER, { clientId: "web-" + Math.random().toString(16).slice(2, 10) });
  client.on("connect", () => { pill($("conn"), true, "Conectado", ""); client.subscribe(prefix + "/#"); });
  client.on("close", () => pill($("conn"), false, "", "Desconectado"));
  client.on("message", (topic, payload, packet) => {
    const sub = topic.slice(prefix.length + 1);
    try {
      if (sub === "estado") mostrarEstado(JSON.parse(payload), !packet.retain);
      else if (sub === "radio/msg") addMsg(JSON.parse(payload));
    } catch (e) { console.warn(e); }
  });
}
// La propia base re-publica lo que enviamos (como "Web"), así que no lo dibujamos aquí
$("f").onsubmit = e => {
  e.preventDefault();
  const t = $("txt").value.trim(); if (!t) return;
  if (client) client.publish(prefix + "/web/msg", t);
  $("txt").value = "";
};
$("sos").onclick = () => {
  if (!confirm("¿Enviar SOS a las estaciones?")) return;
  if (client) client.publish(prefix + "/web/sos", "SOS desde la web");
};

// --- modo demostración (?demo) ---
if (DEMO) {
  pill($("conn"), true, "Demo", "");
  mostrarEstado({ base: true, cerca: { on: false, rssi: 0 }, lora: { on: true, rssi: -101, snr: 4 } }, true);
  addMsg({ de: 2, t: 0, via: "L", x: "Llegué al cerro, ¿me copias?" });
  addMsg({ de: 1, t: 0, via: "L", x: "Fuerte y claro 👍" });
  addMsg({ de: 0, t: 0, via: "L", x: "🌐 Saludos desde la web" });
  addMsg({ de: 2, t: 2, via: "E", x: "🎤 Nota de voz" });
  addMsg({ de: 2, t: 1, via: "L", x: "SOS: botón de emergencia" });
}
</script>
</body>
</html>

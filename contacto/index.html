<title>PanaRepara | Contacto</title>
<meta name="description" content="Escríbenos por WhatsApp, síguenos en Instagram, visita la web o llega a PanaRepara en el Centro Comercial El Dorado, Panamá.">
<meta name="theme-color" content="#022444">
<meta name="robots" content="noindex, follow">
<meta property="og:title" content="PanaRepara | Contacto">
<meta property="og:description" content="Electrónica avanzada y microsoldadura. WhatsApp, Instagram, web y ubicación.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://panarepara.com/contacto/">
<meta property="og:image" content="https://panarepara.com/images/logo.png">

<style>
  :root{--navy:#0c2530;--navy2:#174159;--teal:#1e8fa4;--white:#fff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    font-family:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--white);
    background:radial-gradient(120% 90% at 50% 0%,var(--teal) 0%,var(--navy2) 45%,var(--navy) 100%) fixed;
    display:flex;flex-direction:column;align-items:center;padding:28px 18px 32px;
  }
  .wrap{width:100%;max-width:440px}
  .logo{display:block;width:78%;max-width:300px;margin:6px auto 8px;height:auto}
  .lema{margin:0 0 26px;text-align:center;font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;font-style:italic;color:#d6f1f5}
  .titulo{margin:0 0 14px;text-align:center;font-size:17px;font-weight:600;opacity:.95}
  .botones{display:grid;gap:14px;margin:0;padding:0;list-style:none}
  .btn{
    display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--navy);
    background:var(--white);border-radius:18px;padding:14px 18px;
    box-shadow:0 6px 18px rgba(0,0,0,.28);transition:transform .12s ease,box-shadow .12s ease;
  }
  .btn:hover,.btn:focus-visible{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.34);outline:none}
  .btn:active{transform:translateY(0) scale(.99)}
  .ico{flex:0 0 auto;width:52px;height:52px;border-radius:14px;display:grid;place-items:center}
  .ico svg{width:30px;height:30px;display:block}
  .txt{display:flex;flex-direction:column;min-width:0}
  .txt b{font-size:19px;line-height:1.15}
  .txt span{font-size:14px;color:#4a6575;margin-top:2px;overflow-wrap:anywhere}
  .flecha{margin-left:auto;flex:0 0 auto;width:22px;height:22px;color:#8aa3b3}
  .wa .ico{background:#25d366}
  .ig .ico{background:radial-gradient(circle at 30% 107%,#fdf497 0,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285aeb 90%)}
  .web .ico{background:var(--teal)}
  .map .ico{background:#fff;border:1px solid #d7e2e8}
  .horario{margin:22px 0 0;text-align:center;font-size:14px;color:#cfe9ee}
  .horario b{color:#fff}
  @media (max-width:360px){.txt b{font-size:17px}.btn{padding:12px 14px;gap:12px}.ico{width:46px;height:46px}}
  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
